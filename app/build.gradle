plugins {
    id "com.android.application"
}

android {
    namespace "dev.xpramt.redmagicvowifi"
    compileSdk 37

    defaultConfig {
        applicationId "dev.xpramt.redmagicvowifi"
        minSdk 31
        targetSdk 35
        versionCode 11
        versionName "0.6.0"
        // Tells the generations apart in the log and in a hot reload: every build gets its own marker.
        buildConfigField "String", "BUILD_MARKER", "\"${new Date().format('MMdd-HHmmss')}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    compileOnly "io.github.libxposed:api:102.0.0"
    implementation "io.github.libxposed:service:102.0.0"
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
